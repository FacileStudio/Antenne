# Antenne's coding standard, enforced by filet (https://github.com/FacileStudio/filet).
#
#   filet check .     the rules
#   filet roast .     the rules, with commentary
#   filet docker .    the Dockerfile
#
# filet's own defaults are deliberately stricter than the established tools,
# because filet was refactored until it met them. Antenne was not, so the limits
# below are the *published* defaults of the tools they come from rather than
# numbers picked to make a count go away. Each one names its source.

kind: app

ignore:
  - .git
  - node_modules
  - vendor
  - dist
  - build
  - .svelte-kit
  - _app
  - .output
  - coverage
  - testdata

extensions: [.go, .ts, .svelte]

limits:
  fileLines: 250        # filet's own default: split the file
  funcsPerFile: 8
  funcLines: 30         # filet's own default
  funcStatements: 25    # filet's own default
  lineLength: 120       # lll default
  params: 5
  returns: 3
  nesting: 4            # filet's own default
  complexity: 10        # filet's own default
  structFields: 12      # filet's own default
  interfaceMethods: 4   # filet's own default

architecture:
  requiredDirs: [apps/api, apps/client]
  # A module that owns HTTP declares it in router.go. Antenne only half follows
  # the Go family's convention: the dashboard API, the webhook intake and the
  # pool are all mounted from internal/server/, and the modules below are domain
  # services with no HTTP of their own. Naming them one by one is the point — a
  # new module that grows handlers inline is then a failing build, and moving one
  # of these to router.go is a deletion here rather than an argument.
  requiredFiles:
    "apps/api/modules/*": [router.go]
    "apps/api/modules/settings": []
    "apps/api/modules/events": []
    "apps/api/modules/delivery": []
    "apps/api/modules/health": []
    "apps/api/modules/providers": []
    # Owned by internal/server/webhooks.go, which holds the intake, the
    # signature check and the provider dispatch.
    "apps/api/modules/webhooks": []

style:
  # Off, deliberately. Antenne's function bodies carry why-comments — the Matrix
  # device-id trap, the search_path pooling trap, why a delivery failure alert
  # waits for the retries to be spent. A rule that removes them destroys the only
  # copy of that knowledge. The path back on is to hoist each one into the
  # enclosing function's doc comment, as tronc did; until then this stays false
  # rather than being quietly satisfied by deleting them.
  banInlineComments: false
  banTODO: true
  requireDocComments: true
  banGlobalMutable: true
  banInit: true
  banTrailingSpace: true

disabled:
  # gofmt/rustfmt/prettier owns line breaking; every survivor is a line no
  # formatter could have wrapped. Flagging it is noise that teaches people to
  # stop reading the output. Nothing else is disabled: a rule turned off here
  # must be an argument, not a habit.
  - gen.line.long
failOn: error
