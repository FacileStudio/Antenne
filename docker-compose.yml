services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "${PORT:-9090}"
    environment:
      NOOK_SETTINGS_PATH: ${NOOK_SETTINGS_PATH:-/data/nook.json}
      PORT: ${PORT:-9090}
      NOOK_SESSION_SECRET: ${NOOK_SESSION_SECRET}
      NOOK_ADMIN_PASSWORD: ${NOOK_ADMIN_PASSWORD}
      NOOK_ADMIN_USERNAME: ${NOOK_ADMIN_USERNAME:-admin}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const res = await fetch('http://localhost:${PORT:-9090}/health'); if (!res.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  app_data:
    name: nook_data
