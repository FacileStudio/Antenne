services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antenne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-antenne}
    volumes:
    - antenne-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
    - '9090'
    environment:
      APP_ENV: ${APP_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PORT: '9090'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-antenne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antenne}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ANTENNE_ADMIN_USERNAME: ${ANTENNE_ADMIN_USERNAME:-admin}
      ANTENNE_ADMIN_PASSWORD: ${ANTENNE_ADMIN_PASSWORD:?ANTENNE_ADMIN_PASSWORD is
        required}
      ANTENNE_SECRET: ${ANTENNE_SECRET:-}
      PUBLIC_URL: "${PUBLIC_URL:?PUBLIC_URL is required \u2014 the https origin Antenne\
        \ is reached on}"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_CLI_AUDIENCE: ${OIDC_CLI_AUDIENCE:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      TIMEOUT: ${TIMEOUT:-10}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
      JOURNAL_BROWSER_URL: ${JOURNAL_BROWSER_URL:-}
      JOURNAL_BROWSER_KEY: ${JOURNAL_BROWSER_KEY:-}
    networks:
    - default
    - dokploy-network
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.antenne-web.rule: Host(`antenne.facile.studio`)
      traefik.http.routers.antenne-web.entrypoints: web
      traefik.http.routers.antenne-web.middlewares: redirect-to-https@file
      traefik.http.routers.antenne-web.service: antenne-svc
      traefik.http.routers.antenne-secure.rule: Host(`antenne.facile.studio`)
      traefik.http.routers.antenne-secure.entrypoints: websecure
      traefik.http.routers.antenne-secure.tls.certresolver: letsencrypt
      traefik.http.routers.antenne-secure.service: antenne-svc
      traefik.http.services.antenne-svc.loadbalancer.server.port: '9090'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '9090'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  antenne-postgres: null
networks:
  dokploy-network:
    external: true
