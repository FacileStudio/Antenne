name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Postgres is here so the store tests stop skipping themselves. They gate on
    # TEST_DATABASE_URL and answer a question no unit test can: whether the GORM
    # models still map to the columns the migrations create. A refactor once
    # dropped six columns from a model, and build, vet, race tests, filet and a
    # manual smoke test were all green on it — the round-trip against a real
    # Postgres was the only thing that failed. 16 matches production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: antenne
          POSTGRES_PASSWORD: antenne
          POSTGRES_DB: antenne_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://antenne:antenne@127.0.0.1:5432/antenne_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: tests
        run: go test -race -count=1 -timeout 10m ./...

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: install
        run: bun install --frozen-lockfile

      - name: svelte-check
        run: bun run check

      - name: build
        run: bun run build

  filet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: FacileStudio/filet@v0.19.0
        with:
          version: v0.19.0
          fail-on: error
          # The provider decides what is worth an alert, so the run is always
          # reported and the policy lives in one place. The URL is withheld when
          # the secret is not available — a fork's pull request has no secrets,
          # and signing with an empty key would fail the job on an unrelated
          # repository's configuration.
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}

  # Production dependencies only, failing on a critical advisory. Exit 3 means
  # douane could not see everything, usually a transient OSV error, so it gets
  # one retry before it blocks. The archive is checked against the sha256 pinned
  # here, not against the checksums file of the same release.
  douane:
    runs-on: ubuntu-latest
    env:
      DOUANE_VERSION: "0.7.0"
      DOUANE_SHA256: "718745c1440905ff9c87c1d5eef866d3994beaec39e92f3c033835016f4d7dbb"
    steps:
      - uses: actions/checkout@v7

      - name: Install douane
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          archive="douane_${DOUANE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/FacileStudio/douane/releases/download/v${DOUANE_VERSION}/$archive"
          echo "${DOUANE_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive" douane
          ./douane --version

      - name: Scan dependencies
        run: |
          douane="${{ runner.temp }}/douane"
          code=0
          "$douane" scan -fail critical -scope prod . || code=$?
          case "$code" in
            0) ;;
            3) echo "::warning::douane could not complete the scan, retrying"
               "$douane" scan -fail critical -scope prod . ;;
            *) exit "$code" ;;
          esac
