<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<title>Antenne</title>
		<script>
			// Applied before the first paint so a themed reload does not flash the other
			// mode. Both classes are written and `system` writes neither: muse's tokens
			// flip on prefers-color-scheme scoped to `:root:not(.light)`, so `.light` is
			// the only thing that lets someone force light on a dark OS. A script that
			// only ever adds `.dark` strands exactly those users.
			try {
				const stored = localStorage.getItem('antenne-theme');
				if (stored === 'dark' || stored === 'light') {
					document.documentElement.classList.add(stored);
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
